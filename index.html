<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="settings-container">
    <header class="page-header">
      <p class="eyebrow">Account preferences</p>
      <h1>User settings</h1>
      <p>Update how your account and notifications work.</p>
    </header>

    <form id="settingsForm" novalidate>
      <section class="settings-section" aria-labelledby="account-heading">
        <h2 id="account-heading">Account</h2>
        <div class="field">
          <label for="username">Username <span aria-hidden="true">*</span></label>
          <input type="text" id="username" name="username" autocomplete="username" required aria-describedby="username-help">
          <p id="username-help" class="hint">Choose the name shown in your account.</p>
        </div>
        <div class="field">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="display-heading">
        <h2 id="display-heading">Display</h2>
        <div class="field">
          <label for="theme">Theme</label>
          <select id="theme" name="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
        </div>
        <div class="field">
          <label for="fontSize">Font size</label>
          <select id="fontSize" name="fontSize"><option value="16">16px</option><option value="18">18px</option><option value="20">20px</option></select>
        </div>
      </section>

      <fieldset class="settings-section">
        <legend>Notifications</legend>
        <div class="check-row"><input type="checkbox" id="emailAlerts" name="emailAlerts"><label for="emailAlerts">Enable email alerts</label></div>
        <div class="check-row"><input type="checkbox" id="inAppNotifications" name="inAppNotifications"><label for="inAppNotifications">Enable in-app notifications</label></div>
      </fieldset>

      <button id="saveButton" type="submit">Save settings</button>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
